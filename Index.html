    <style>
      /* === PURE CUSTOM CSS FRAMEWORK (SMPB LAYOUT) === */
      * { box-sizing: border-box; }
      body { 
        background-color: #f8fafc; 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 0;
        overflow-x: hidden; 
        color: #1e293b;
      }

      .smpb-app-wrapper { display: flex; min-height: 100vh; width: 100%; }
      
      /* SIDEBAR STYLING */
      .smpb-sidebar {
        width: 270px;
        background: linear-gradient(135deg, #2e1065 0%, #581c87 50%, #6b21a8 100%);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
        z-index: 1045;
        transition: transform 0.3s ease, margin-left 0.3s ease;
      }
      
      .smpb-sidebar-header {
        padding: 24px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
        position: relative;
      }

      .smpb-sidebar-title {
        font-size: 0.95rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ffffff;
        margin: 8px 0 0 0;
        line-height: 1.3;
      }

      .smpb-sidebar-menu {
        display: flex;
        flex-direction: column;
        padding-top: 15px;
        flex-grow: 1;
      }

      .smpb-menu-label {
        padding: 0 24px;
        margin-bottom: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 1px;
      }

      .smpb-nav-btn { 
        color: rgba(255, 255, 255, 0.8); 
        font-weight: 500; 
        padding: 12px 20px; 
        margin: 4px 16px; 
        border-radius: 8px; 
        font-size: 0.9rem; 
        display: flex; 
        align-items: center; 
        cursor: pointer; 
        transition: all 0.25s ease; 
        text-decoration: none;
      }
      .smpb-nav-btn:hover { 
        background-color: rgba(255, 255, 255, 0.15); 
        color: #ffffff; 
        transform: translateX(4px); 
      }
      .smpb-nav-btn i { width: 26px; text-align: center; font-size: 1.05rem; }

      .smpb-sidebar-footer {
        padding: 20px;
        margin-top: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      /* MAIN CONTENT AREA */
      .smpb-main-content { 
        flex-grow: 1; 
        overflow-y: auto; 
        height: 100vh; 
        background-color: #f8fafc; 
        transition: width 0.3s ease; 
      }

      /* TOP NAVBAR */
      .smpb-top-navbar {
        background: #ffffff;
        padding: 12px 24px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        position: sticky;
        top: 0;
        z-index: 1020;
      }

      .smpb-navbar-left, .smpb-navbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* BUTTONS & BADGES */
      .smpb-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
      }

      .smpb-btn-menu {
        background: #ffffff;
        color: #475569;
        border: 1px solid #cbd5e1;
      }
      .smpb-btn-menu:hover { background: #f1f5f9; color: #1e293b; }

      .smpb-btn-logout {
        background: #ef4444;
        color: #ffffff;
        width: 100%;
      }
      .smpb-btn-logout:hover { background: #dc2626; }

      .smpb-badge {
        display: inline-block;
        padding: 6px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 4px;
        letter-spacing: 0.5px;
      }
      .smpb-badge-sekolah { background: #10b981; color: #ffffff; }
      .smpb-badge-ppd { background: #3b82f6; color: #ffffff; }
      .smpb-badge-jpn { background: #f59e0b; color: #ffffff; }
      .smpb-badge-default { background: #ef4444; color: #ffffff; }

      /* YEAR FILTER DROPDOWN CONTAINER */
      .smpb-tahun-container {
        display: flex;
        align-items: center;
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
      }

      .smpb-select-tahun {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #6b21a8;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        outline: none;
        margin-left: 8px;
      }

      /* MOBILE & RESPONSIVE LAYOUT */
      .smpb-mobile-header { display: none; }
      .smpb-sidebar-overlay { display: none; }

      .smpb-d-none { display: none !important; }

      @media (min-width: 769px) { 
        .smpb-sidebar.collapsed-desktop { margin-left: -270px; } 
      }

      @media (max-width: 768px) {
        .smpb-app-wrapper { flex-direction: column; }
        .smpb-mobile-header {
          display: flex;
          background: linear-gradient(135deg, #2e1065 0%, #6b21a8 100%);
          color: #ffffff;
          padding: 14px 20px;
          align-items: center;
          justify-content: space-between;
          z-index: 1040;
          position: sticky;
          top: 0;
        }
        .smpb-sidebar-overlay {
          display: none; 
          position: fixed; 
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: rgba(0, 0, 0, 0.5); 
          z-index: 1040; 
          opacity: 0; 
          transition: opacity 0.3s ease;
        }
        .smpb-main-content { height: auto; min-height: calc(100vh - 60px); }
        .smpb-sidebar { 
          position: fixed; 
          top: 0; left: 0; 
          height: 100vh; 
          transform: translateX(-100%); 
        }
        .smpb-sidebar.show { transform: translateX(0); }
        .smpb-sidebar-overlay.show { display: block; opacity: 1; }
        .smpb-desktop-btn { display: none !important; }
      }
    </style>
  </head>
  <body>

    <div id="appContainer">
      <div id="kawasanLoginUtama">
        <?!= include('Login'); ?>
      </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      var G_USER = null;
      var G_DATA = null;
      var backupHtmlLogin = "";
      var G_TAHUN_AKTIF = new Date().getFullYear().toString();
      
      $(document).ready(function() {
        backupHtmlLogin = $('#kawasanLoginUtama').html();
      });

      function toggleSidebarMobile() { 
        $('#mainSidebar').toggleClass('show'); 
        $('#sidebarOverlay').toggleClass('show'); 
      }
      
      function tutupSidebarMobile() { 
        if ($(window).width() <= 768) { 
          $('#mainSidebar').removeClass('show'); 
          $('#sidebarOverlay').removeClass('show'); 
        } 
      }
      
      function toggleSidebarDesktop() { 
        $('#mainSidebar').toggleClass('collapsed-desktop'); 
      }

      function initGlobalTahun() {
        var currentYr = new Date().getFullYear();
        var htmlYr = '';
        for (var y = 2024; y <= currentYr + 1; y++) {
          var isSelected = (y === parseInt(G_TAHUN_AKTIF)) ? 'selected' : '';
          htmlYr += `<option value="${y}" ${isSelected}>${y}</option>`;
        }
        $('#globalFilterTahun').html(htmlYr);
      }

      function tukarTahunGlobal() {
        G_TAHUN_AKTIF = $('#globalFilterTahun').val();
        window.G_TAHUN_AKTIF = G_TAHUN_AKTIF; 

        // NOTIFIKASI POP-UP TOAST UMUM
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'Sesi Tahun ' + G_TAHUN_AKTIF + ' telah berjaya dipilih!',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true
        });
        
        // PEMERIKSAAN KEMAS KINI DAERAH/MODUL AKTIF
        if (typeof initModulOperasi === 'function' && $('#pane-pemantauan').length > 0) {
          initModulOperasi();
        }
        else if (typeof saringDataIkutTahapPk === 'function' && $('#tblReportPkBody').length > 0 && $('#tblReportPkBody').is(':visible')) {
          saringDataIkutTahapPk();
        }
        else if (typeof saringDataIkutTahapKp === 'function' && $('#tblReportKpBody').length > 0 && $('#tblReportKpBody').is(':visible')) {
          saringDataIkutTahapKp();
        }
        else if (typeof renderJadualKpn === 'function' && $('#tblReportKpnBody').length > 0 && $('#tblReportKpnBody').is(':visible')) {
          renderJadualKpn();
        }
        else if (typeof muatDataOperasiSekolah === 'function' && $('#modul-operasi-sekolah').length > 0) {
          muatDataOperasiSekolah();
        }
      }

      function panggilHalaman(namaHalaman) {
        Swal.fire({ 
          title: 'Memuatkan Modul...', 
          text: 'Sila tunggu sebentar...', 
          allowOutsideClick: false, 
          didOpen: () => { Swal.showLoading(); } 
        });

        google.script.run
          .withSuccessHandler(function(htmlKandungan) {
            Swal.close();
            
            var butangNavigasiHtml = '';
            var perananSemasa = (G_USER && G_USER.role) ? G_USER.role.toString().toUpperCase() : "";
            var emelSemasa = (G_USER && G_USER.emel) ? G_USER.emel : "Pengguna";

            if (perananSemasa === 'SEKOLAH') {
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'SekolahView\')"><i class="fa-solid fa-school"></i>Profil & Pentaksir</a>';
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'OperasiSekolahView\')"><i class="fa-solid fa-clipboard-user"></i>Operasi Matriks</a>';
            } else {
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'ProfilSekolah\')"><i class="fa-solid fa-building-columns"></i>Profil Sekolah</a>';
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'OperasiMatriks\')"><i class="fa-solid fa-satellite-dish"></i>Operasi Matriks</a>';
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'PentaksirView\')"><i class="fa-solid fa-user-tie"></i>Ketua Pentaksir</a>';
              butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'LaporanView\')"><i class="fa-solid fa-file-pdf"></i>Laporan Cetakan</a>';
              
              // SIFU UPDATE: KAWALAN AKSES MENU KONFIGURASI 
              // Hanya PPD, JPN dan ADMIN sahaja yang dapat melihat menu ini
              if (perananSemasa === 'PPD' || perananSemasa === 'JPN' || perananSemasa === 'ADMIN') {
                butangNavigasiHtml += '<div class="smpb-menu-label mt-3" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top:12px;">Sistem & Pengurusan</div>';
                butangNavigasiHtml += '<a class="smpb-nav-btn" onclick="tutupSidebarMobile(); panggilHalaman(\'konfigurasi\')" style="color: #fbbf24;"><i class="fa-solid fa-user-shield"></i>Konfigurasi</a>';
              }
            }

            var kelasBadge = 'smpb-badge-default'; 
            if (perananSemasa === 'SEKOLAH') { kelasBadge = 'smpb-badge-sekolah'; } 
            else if (perananSemasa === 'PPD') { kelasBadge = 'smpb-badge-ppd'; } 
            else if (perananSemasa === 'JPN') { kelasBadge = 'smpb-badge-jpn'; }

            var htmlBadgePeranan = '';
            if (perananSemasa !== "") {
              htmlBadgePeranan = '<span class="smpb-badge ' + kelasBadge + '"><i class="fa-solid fa-user-shield"></i> ' + perananSemasa + '</span>';
            }

            // Sembunyikan dropdown tahun untuk modul Konfigurasi juga
            var kelasSembunyiTahun = (namaHalaman === 'ProfilSekolah' || namaHalaman === 'SekolahView' || namaHalaman === 'OperasiSekolahView' || namaHalaman === 'konfigurasi') ? 'smpb-d-none' : '';

            var layoutBersih = 
              '<div class="smpb-app-wrapper">' +
                '<!-- Header Mudah Alih -->' +
                '<div class="smpb-mobile-header">' +
                  '<div style="display:flex; align-items:center; gap:8px;">' +
                    '<i class="fa-solid fa-layer-group fs-5"></i>' +
                    '<span style="font-weight:700; letter-spacing:0.5px;">Matriks Pembelajaran</span>' +
                  '</div>' +
                  '<button class="smpb-btn smpb-btn-menu" style="padding:4px 10px; background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff;" onclick="toggleSidebarMobile()"><i class="fa-solid fa-bars fs-5"></i></button>' +
                '</div>' +
                
                '<div class="smpb-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebarMobile()"></div>' +

                '<!-- Sidebar Utama -->' +
                '<div class="smpb-sidebar" id="mainSidebar">' +
                  '<div class="smpb-sidebar-header">' +
                    '<i class="fa-solid fa-graduation-cap fa-2x" style="color:#ffffff;"></i>' +
                    '<h6 class="smpb-sidebar-title">Sistem Matriks<br>Pembelajaran</h6>' +
                  '</div>' +
                  
                  '<div class="smpb-sidebar-menu">' +
                    '<div class="smpb-menu-label">Menu Utama</div>' +
                    butangNavigasiHtml +
                  '</div>' +
                  
                  '<div class="smpb-sidebar-footer">' +
                    '<div style="text-align:center; margin-bottom:12px;">' +
                      htmlBadgePeranan +
                      '<div style="font-size:0.8rem; font-weight:600; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ffffff;" title="'+emelSemasa+'"><i class="fa-solid fa-user" style="opacity:0.75; margin-right:6px;"></i>' + emelSemasa + '</div>' +
                    '</div>' +
                    '<button class="smpb-btn smpb-btn-logout" onclick="prosesLogout();"><i class="fa-solid fa-power-off" style="margin-right:8px;"></i>Log Keluar</button>' +
                  '</div>' +
                '</div>' +
                
                '<!-- Kawasan Kandungan Utama -->' +
                '<div class="smpb-main-content" id="mainContentArea">' + 
                  
                  '<!-- Top Navbar Global -->' +
                  '<div class="smpb-top-navbar">' +
                    '<div class="smpb-navbar-left">' +
                      '<button class="smpb-btn smpb-btn-menu smpb-desktop-btn" onclick="toggleSidebarDesktop()">' +
                        '<i class="fa-solid fa-bars" style="margin-right:6px;"></i>Menu' +
                      '</button>' +
                      '<span style="font-weight:700; font-size:0.92rem; color:#1e293b;"><i class="fa-solid fa-desktop text-primary" style="margin-right:8px; color:#6b21a8;"></i>Ruang Kerja Pentadbiran</span>' +
                    '</div>' +
                    
                    '<div id="globalTahunContainer" class="smpb-tahun-container ' + kelasSembunyiTahun + '">' +
                      '<i class="fa-regular fa-calendar-check" style="color:#6b21a8; font-size:0.9rem;"></i>' +
                      '<span style="font-size:0.75rem; font-weight:700; color:#475569; margin-left:6px;">TAHUN SESI:</span>' +
                      '<select id="globalFilterTahun" class="smpb-select-tahun" onchange="tukarTahunGlobal()">' +
                      '</select>' +
                    '</div>' +
                  '</div>' +
                  
                  '<!-- Content Injection -->' +
                  '<div style="padding: 20px;" id="moduleContainerArea">' +
                    htmlKandungan +
                  '</div>' +

                '</div>' +
                
              '</div>';

            $('#appContainer').html(layoutBersih);

            setTimeout(function() {
              try {
                initGlobalTahun();
                
                if (namaHalaman === 'SekolahView' && typeof initSekolah === 'function') {
                  initSekolah();
                } else if (namaHalaman === 'ProfilSekolah' && typeof initProfilSekolah === 'function') {
                  initProfilSekolah();
                } else if (namaHalaman === 'OperasiMatriks' && typeof initModulOperasi === 'function') {
                  initModulOperasi();
                } else if (namaHalaman === 'PenyeliaKawasanView' && typeof initPenyeliaKawasan === 'function') {
                  initPenyeliaKawasan();
                } else if (namaHalaman === 'PentaksirView' && typeof initKetuaPentaksir === 'function') {
                  initKetuaPentaksir();
                } else if (namaHalaman === 'LaporanView' && typeof initLaporanView === 'function') {
                  initLaporanView();
                } else if (namaHalaman === 'OperasiSekolahView' && typeof muatDataOperasiSekolah === 'function') {
                  muatDataOperasiSekolah();
                } else if (namaHalaman === 'konfigurasi' && typeof muatSenaraiAksesSekolah === 'function') {
                  muatSenaraiAksesSekolah(); // Panggil fungsi memuat data bila tab ini diklik
                }
              } catch (errDalaman) {
                console.warn("Status muatan fungsi dalaman: Berjalan mandiri.", errDalaman);
              }
            }, 200);
            
          })
          .withFailureHandler(function(err) {
            Swal.close();
            Swal.fire('Ralat Muatan', 'Fail HTML tidak wujud atau belum dicipta: ' + err.message, 'error');
          })
          .include(namaHalaman);
      }

      function prosesLogout() {
        Swal.fire({
          title: 'Log Keluar?',
          text: "Adakah anda pasti mahu keluar?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#ef4444',
          cancelButtonColor: '#64748b',
          confirmButtonText: 'Ya',
          cancelButtonText: 'Batal'
        }).then((result) => {
          if (result.isConfirmed) {
            G_USER = null;
            G_DATA = null;
            $('#appContainer').html('<div id="kawasanLoginUtama">' + backupHtmlLogin + '</div>');
            Swal.fire({ icon: 'success', title: 'Berjaya Keluar', timer: 1000, showConfirmButton: false });
          }
        });
      }
    </script>
  </body>
</html>
